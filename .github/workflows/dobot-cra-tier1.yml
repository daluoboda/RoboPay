name: Dobot CRA Tier 1 contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tunnel/**"
      - "bridge/common/**"
      - "registry/vendors/dobot/**"
      - "scripts/registry/**"
      - ".github/workflows/dobot-cra-tier1.yml"
  push:
    branches: [dobot-cra-tier-1]
    paths:
      - "tunnel/**"
      - "bridge/common/**"
      - "registry/vendors/dobot/**"
      - "scripts/registry/**"
      - ".github/workflows/dobot-cra-tier1.yml"

jobs:
  tunnel-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build and test the real Go Tunnel
        run: |
          make build
          make test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dobot bridge and test dependencies
        run: python -m pip install -r registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge/requirements-dev.txt
      - name: Run fail-closed profile and registry contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge
        run: |
          python -m pytest -q registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/tests/test_contract.py registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/tests/test_bridge_contract.py registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/tests/test_registry_contract.py
      - name: Prove invalid payment cannot reach Zenoh, simulator, or settlement
        env:
          PYTHONPATH: ${{ github.workspace }}/registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge
          TUNNEL_BIN: ${{ github.workspace }}/bin/tunnel
          LD_LIBRARY_PATH: ${{ github.workspace }}/.zenoh-c/lib
        run: python -m pytest -q registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/tests/test_x402_invalid_payment_gate.py

  dobot-mujoco:
    name: Dobot CR3 MuJoCo policy and payment-gate proof
    runs-on: ubuntu-latest
    needs: tunnel-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned CR3 bridge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge/requirements-dev.txt
      - name: Run measured MuJoCo inspection and real Zenoh replay proof
        env:
          PYTHONPATH: ${{ github.workspace }}/registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge
        run: |
          python -m pytest -q registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/tests/test_mujoco_runtime.py registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/tests/test_real_zenoh_bridge.py
          python registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge/run_mujoco_inspection.py --json-output registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/artifacts/mujoco_result.json
      - name: Upload MuJoCo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobot-cra-mujoco-evidence
          path: registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/artifacts/mujoco_result.json
          retention-days: 90
          if-no-files-found: error

  dobot-sim2sim:
    name: Dobot CR3 Sim-to-Sim (MuJoCo + Webots)
    runs-on: ubuntu-latest
    needs: tunnel-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Webots and simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb unzip \
            libgl1 libglu1-mesa libglib2.0-0 libgomp1 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 \
            libxext6 libxrender1 libxtst6 libxi6 libxss1 libqt5core5a \
            libqt5gui5 libqt5widgets5 libqt5network5 libqt5svg5 \
            libqt5webengine5 libqt5webenginecore5 libqt5webenginewidgets5 \
            libqt5multimedia5 libqt5printsupport5 libqt5concurrent5 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
          sudo apt-get install -y libsndio7.0 2>/dev/null || sudo apt-get install -y libsndio-dev 2>/dev/null || true
          python -m pip install --upgrade pip
          python -m pip install -r registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge/requirements.txt
          wget -q https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a-x86-64.tar.bz2
          sudo tar xjf webots-R2025a-x86-64.tar.bz2 -C /usr/local
          rm webots-R2025a-x86-64.tar.bz2
      - name: Run the same bounded CR3 inspection policy in both simulators
        env:
          PYTHONPATH: ${{ github.workspace }}/registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge
          WEBOTS_EXE: /usr/local/webots/webots
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge/run_sim2sim_validation.py
      - name: Upload Sim-to-Sim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobot-cra-sim2sim-evidence
          path: registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/artifacts/
          retention-days: 90
          if-no-files-found: error

  dobot-base-sepolia-e2e:
    name: Dobot CR3 Base Sepolia settlement evidence
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: dobot-cra-base-sepolia-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: tunnel-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies and the real Tunnel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge/requirements.txt
          make build
      - name: Start local Zenoh router
        run: |
          wget -q https://github.com/eclipse-zenoh/zenoh/releases/download/1.9.0/zenoh-1.9.0-x86_64-unknown-linux-gnu-standalone.zip
          unzip -q zenoh-1.9.0-x86_64-unknown-linux-gnu-standalone.zip -d .zenoh-router
          .zenoh-router/zenohd > zenohd.log 2>&1 &
          sleep 2
          grep -q "zenohd" zenohd.log
      - name: Run live Base Sepolia proof and generate public evidence
        env:
          PRIVATE_KEY: ${{ secrets.BASE_SEPOLIA_PRIVATE_KEY }}
          ROBO_PAYEE_ADDRESS: ${{ secrets.ROBO_PAYEE_ADDRESS }}
          TUNNEL_BIN: ${{ github.workspace }}/bin/tunnel
          LD_LIBRARY_PATH: ${{ github.workspace }}/.zenoh-c/lib
          PROXY_WS_URL: wss://api.fabric.foundation/api/core/ws/robot
          PYTHONPATH: ${{ github.workspace }}/registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge
        run: python registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/bridge/run_live_base_sepolia_e2e.py --ci
      - name: Upload generated Base Sepolia evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobot-cra-base-sepolia-evidence
          path: registry/vendors/dobot/cra/dobot.cra.cr3-mujoco-webots-inspection.v1/artifacts/base_sepolia_result_*.json
          retention-days: 90
          if-no-files-found: error
