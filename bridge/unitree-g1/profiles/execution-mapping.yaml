# unitree-g1 execution mapping
schemaVersion: execution-mapping.v1

transport:
  type: zenoh
  topic: robot/tunnel/action

mappings:
  move_forward:
    output: mujoco_actuator
    actuators:
      vx: "$params.speed"
      vy: 0
      wz: 0
    durationSec: "$params.durationSec"
    metrics:
      - type: position_change
        description: Robot displaced from start position
      - type: collision_status
        description: No collisions during movement

  navigate_obstacle:
    output: mujoco_actuator
    planner: potential_field
    actuators:
      vx: "$planner.vx"
      vy: "$planner.vy"
      wz: "$planner.wz"
    metrics:
      - type: path_completion
        description: Reached goal within 0.3m tolerance
      - type: collision_status
        description: No collisions during navigation
      - type: path_length
        description: Total path length in meters

  stop:
    output: mujoco_actuator
    actuators:
      vx: 0
      vy: 0
      wz: 0
    metrics: []
