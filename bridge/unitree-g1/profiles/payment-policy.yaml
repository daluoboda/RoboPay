# unitree-g1 payment policy
schemaVersion: payment-policy.v1

provider: x402
network: eip155:84532  # Base Sepolia
token: USDC

lifecycle:
  - phase: request
    status: 402
    description: Payment required before execution
  - phase: verify
    status: 200
    description: Payment verified, action accepted
  - phase: execute
    status: 200
    description: Action executed successfully
  - phase: settle
    status: 200
    description: Payment settled after successful execution

safety:
  failClosed: true
  noSettleOnFailure: true
  idempotencyKeyRequired: true
  replayProtection: true

secrets:
  privateKeyEnv: UNITREE_G1_PRIVATE_KEY
  walletAddressEnv: UNITREE_G1_WALLET_ADDRESS
  payToAddressEnv: UNITREE_G1_PAYTO_ADDRESS
  neverCommitToRepo: true
