schemaVersion: robot-skills.v1
profileId: laok.fabric-arm-001.pick-place.v1

skills:
  - skillId: fabric_arm_pick_place
    name: Physics-executed pick-and-place
    description: >-
      Runs a deterministic MuJoCo pick_object controller that moves above the
      cube, descends, closes the gripper under contact gating, and lifts the
      object. Returns object lift, contact force, and collision metrics.
    tier: 1
    customBehavior: true
    params: {}
    paymentRequired: true
    timeoutSec: 30
    safety:
      requiresEnabledIdle: true
      requiresNoActiveProject: true
      emergencyStop: software failsafe aborts the simulation on anomaly
      softwareFailureAction: abort simulation, never retry the lift
    implementation:
      source: bridge/laok_fabric_arm_zenoh_bridge.py
      artifactManifest: bridge/simulator.py
