schemaVersion: payment-policy.v1
profileId: laok.fetch-001.fetch-mobile-pick.v1
provider: x402
network: eip155:84532
asset: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
assetSymbol: USDC
assetDecimals: 6
amountUnit: smallest
payeeEnv: ROBOT_PAYEE_ADDRESS

policies:
  - skillId: fetch_mobile_pick
    required: true
    amount: "100000"
    displayAmount: "0.10 USDC"
    paymentHeader: PAYMENT-SIGNATURE
    executionGate:
      requiredPaymentState: authorized
      rejectAlreadySettled: true
      requiredEvidence:
        - authorizationId
        - verified
        - status
        - settled
        - network
        - asset
        - amount
        - payTo
        - issuedAt
        - expiresAt
    settlement:
      eligibleOnlyAfterResultStatus: success
      noSettleResultStatuses:
        - error
        - pending
        - timeout
        - rejected

# Pi Network payment support (Fabric Foundation x @PiCoreTeam partnership, Aug 2026)
piNetworks:
  - pi-testnet
piPolicies:
  - skillId: fetch_mobile_pick
    amount: "100000000"
    displayAmount: "1 PI"
    assetSymbol: PI
    assetDecimals: 8
