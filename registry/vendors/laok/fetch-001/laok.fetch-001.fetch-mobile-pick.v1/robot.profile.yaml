schemaVersion: robot-profile.v1
vendor: laok
robotModel: fetch-001
robotType: simulated-manipulator
profileId: laok.fetch-001.fetch-mobile-pick.v1
profileVersion: 1.0.0

displayName: "laok fetch-001 MuJoCo pick and stack"
description: >-
  Simulated 4-DoF arm with a gripper (fetch-001) running a deterministic,
  physics-executed fetch-mobile-pick skill in the MuJoCo engine. The skill is
  triggered only after a verified x402 USDC payment over Base Sepolia, and its
  result is returned asynchronously over Zenoh (robot/tunnel/result).
submission:
  scope: simulated
  tier: 1
  customSkillEvidence: bridge/laok_fetch_mobile_001_zenoh_bridge.py

runtime:
  transport: zenoh
  actionTopic: robot/tunnel/action
  resultTopic: robot/tunnel/result
  bridge: laok-fetch-001-zenoh
  controlStack:
    simulator: MuJoCo (mujoco-python)
    controller: deterministic 5-phase fetch_mobile_pick policy
    sdk: x402 + zenoh-python

identity:
  robotIdEnv: ROBOT_ID
  robotPrivateKeyEnv: ROBOT_PRIVATE_KEY
  payeeWalletEnv: ROBOT_PAYEE_ADDRESS
  note: Secrets and the robot wallet address are never stored in this profile.

maintainers:
  - github: daluoboda

status: experimental
