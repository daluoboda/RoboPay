schemaVersion: execution-mapping.v1
profileId: laok.push-arm-001.push-object.v1

transport:
  type: zenoh
  actionTopic: robot/tunnel/action
  resultTopic: robot/tunnel/result
  actionSchema: robopay-action.v1
  resultSchema: robot-action-result.v1

envelope:
  requiredFields:
    - actionId
    - robotId
    - skillId
    - params
    - paramsHash
    - idempotencyKey
    - payment
  requiredPaymentFields:
    - provider
    - authorizationId
    - verified
    - status
    - settled
    - network
    - asset
    - amount
    - payTo
    - issuedAt
    - expiresAt
  paramsHashAlgorithm: sha256(canonical-json(params))
  correlationField: actionId

mappings:
  push_arm_push_object:
    output: mujoco_simulator
    projectNameFrom: local-config.skills.push_arm_push_object.project_name
    sdkCommand: push_object
    requestParametersAllowed: false
    completion:
      runningEvidence:
        - stage equals approach
        - stage equals push
        - graspState equals closed
      successEvidence:
        - objectPushed greater than 0.030
        - contactSamples greater than 19
        - objectLifted less than 0.035
        - collisionCount equals 0
        - graspState equals closed
    failure:
      modes:
        - unreachable
        - collision
        - timeout
        - unsettled
        - push_failed
      action: Abort
      retryRunScript: false

replayProtection:
  storage: sqlite
  key: idempotencyKey
  uniqueFields:
    - actionId
    - payment.authorizationId
  fingerprintFields:
    - actionId
    - robotId
    - skillId
    - paramsHash
    - payment.authorizationId
