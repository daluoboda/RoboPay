schemaVersion: robot-skills.v1
profileId: laok.sort-arm-001.pick-and-sort.v1

skills:
  - skillId: sort_arm_pick_and_sort
    name: Object routing service (bin A / bin B)
    description: >-
      Paid robot service: routes an incoming object to a client-specified
      destination bin (A or B). 7-phase MuJoCo controller picks the object,
      lifts, traverses to the target bin, releases, and verifies routing
      accuracy. params.target_bin drives the routing decision, making this a
      parameter-driven service distinct from fixed-destination skills.
    tier: 1
    customBehavior: true
    params:
      target_bin:
        type: string
        enum: ["A", "B"]
        description: Destination bin for object routing
    paymentRequired: true
    timeoutSec: 30
    safety:
      requiresEnabledIdle: true
      requiresNoActiveProject: true
      emergencyStop: software failsafe aborts the simulation on anomaly
      softwareFailureAction: abort simulation, never retry the lift
    implementation:
      source: bridge/laok_sort_arm_001_zenoh_bridge.py
      artifactManifest: bridge/simulator.py
