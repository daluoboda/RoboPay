schemaVersion: execution-mapping.v1
profileId: laok.stack-arm-001.pick-and-stack.v1

transport:
  type: zenoh
  actionTopic: robot/tunnel/action
  resultTopic: robot/tunnel/result
  actionSchema: robopay-action.v1
  resultSchema: robot-action-result.v1

envelope:
  requiredFields:
    - actionId
    - robotId
    - skillId
    - params
    - paramsHash
    - idempotencyKey
    - payment
  requiredPaymentFields:
    - provider
    - authorizationId
    - verified
    - status
    - settled
    - network
    - asset
    - amount
    - payTo
    - issuedAt
    - expiresAt
  paramsHashAlgorithm: sha256(canonical-json(params))
  correlationField: actionId

mappings:
  stack_arm_pick_and_stack:
    output: mujoco_simulator
    projectNameFrom: local-config.skills.stack_arm_pick_and_stack.project_name
    sdkCommand: pick_and_stack
    requestParametersAllowed: false
    completion:
      runningEvidence:
        - stage equals move_above_b
        - graspState equals attached
      successEvidence:
        - graspState equals stacked
        - stackStable equals true
        - a_z greater than b_z
        - collisionCount equals 0
    failure:
      modes:
        - unreachable
        - collision
        - timeout
        - grasp_failed
        - stack_failed
      action: Abort
      retryRunScript: false

replayProtection:
  storage: sqlite
  key: idempotencyKey
  uniqueFields:
    - actionId
    - payment.authorizationId
  fingerprintFields:
    - actionId
    - robotId
    - skillId
    - paramsHash
    - payment.authorizationId
