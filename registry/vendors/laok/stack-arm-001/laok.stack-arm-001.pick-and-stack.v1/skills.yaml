schemaVersion: robot-skills.v1
profileId: laok.stack-arm-001.pick-and-stack.v1

skills:
  - skillId: stack_arm_pick_and_stack
    name: Physics-executed pick-and-stack
    description: >-
      7-phase MuJoCo pick_and_stack controller: approaches cube A, descends,
      closes gripper (contact-gated), lifts A, traverses to above cube B,
      descends and releases A onto B, then verifies A rests stably on B.
      Metrics: object_A_z, object_B_z, stack_stability, contact force.
    tier: 1
    customBehavior: true
    params: {}
    paymentRequired: true
    timeoutSec: 30
    safety:
      requiresEnabledIdle: true
      requiresNoActiveProject: true
      emergencyStop: software failsafe aborts the simulation on anomaly
      softwareFailureAction: abort simulation, never retry the lift
    implementation:
      source: bridge/laok_stack_arm_001_zenoh_bridge.py
      artifactManifest: bridge/simulator.py
