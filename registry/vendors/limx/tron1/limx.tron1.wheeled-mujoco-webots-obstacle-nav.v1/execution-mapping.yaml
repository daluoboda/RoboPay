schemaVersion: execution-mapping.v1
profileId: limx.tron1.wheeled-mujoco-webots-obstacle-nav.v1
model:
  source: https://github.com/limxdynamics/robot-description
  commit: 469df8dbb56802b127ca8e2c5df23360c6c5488d
  urdf: vendor/limxdynamics/robot-description/WF_TRON1A/urdf/robot.urdf
  mjcf: vendor/limxdynamics/robot-description/WF_TRON1A/xml/robot.xml
  urdfSha256: e5aa9ee49e4e39c201da225e1f734318331c70383ab941da17d80ae59f90e46e
  mujoco: Loads the pinned vendor MJCF and pinned vendor ONNX policy directly.
  webots: Converts the same pinned vendor URDF and STL meshes to Webots R2025a.
transport:
  type: zenoh
  actionTopic: robot/tunnel/action
  resultTopic: robot/tunnel/result
  metricsTopic: robot/limx_tron1/metrics
paramsHashFormat: "sha256:<hex>"
mappings:
  navigate_obstacle_course:
    task: fixed_three_obstacle_navigation
    policy: >-
      A shared state-driven route planner selects velocity commands from the
      measured base pose. Both simulators map them through LimX's pinned official
      ONNX policy into joint torques; no root-pose write, qpos teleport or
      prerecorded trajectory is used.
    inputs: []
    metrics: [waypoints_completed, detected_obstacles, minimum_clearance_m, collision, goal_distance_m, final_base_pose]
    limits:
      maxDurationSec: 70
      maxLinearVelocityMps: 0.65
      maxYawRateRadPerSec: 0.5
    success: ten waypoints and goal reached, all obstacles detected, no collision, finite safe state
  stop:
    task: safe_stop
    output: correlated terminal safe-stop result
    success: zero velocity retained and navigation not started
